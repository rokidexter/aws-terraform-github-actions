---
- name: Configure web server
  hosts: webservers
  become: true

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Enable and start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Create application test page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <title>Terraform DevOps Project</title>
          </head>
          <body>
            <h1>Terraform + Ansible Web Server</h1>
            <p>Infrastructure provisioned with Terraform.</p>
            <p>Server configured with Ansible.</p>
          </body>
          </html>
        owner: www-data
        group: www-data
        mode: "0644"
